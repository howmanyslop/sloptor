name: Deploy Documentation

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      sloptor-artifact:
        default: ""
        description: >-
          Name of a linux-x64 sloptor artifact from the calling run. When set,
          gen-docs runs that binary instead of compiling one.
        required: false
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy.
        required: true
        default: main
        type: string

permissions: {}

env:
  # mbx's local cache starts empty on a runner.
  MBX_DISABLE: "1"

concurrency:
  group: deploy-documentation
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    environment:
      name: documentation
      url: https://docs.howmanysmall.com/sloptor/
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache-key: docs
          tools: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - if: inputs.sloptor-artifact != ''
        name: Download sloptor binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.sloptor-artifact }}
          path: ${{ runner.temp }}/sloptor

      # build runs gen-docs first, so the command reference matches this ref.
      # A release passes its own binary instead: compiling one here takes most
      # of this job, and tag runs never restore the cargo cache.
      - name: Build documentation
        run: |
          set -euo pipefail
          if [ -z "$SLOPTOR_ARTIFACT" ]; then
            node --run build
            exit 0
          fi
          bin=$(find "$RUNNER_TEMP/sloptor" -type f)
          chmod +x "$bin"
          "$bin" gen-docs src/content/docs/commands
          pnpm exec astro build
        shell: bash
        working-directory: documentation
        env:
          SLOPTOR_ARTIFACT: ${{ inputs.sloptor-artifact }}

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        working-directory: documentation
    timeout-minutes: 15
