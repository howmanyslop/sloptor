name: ci-documentation

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether this change touches the site. A skipped job still
  # satisfies a required check, so a Go-only PR never waits on it.
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      documentation: ${{ steps.filter.outputs.documentation }}
    steps:
      # Pushes are diffed with git; pull requests ask the API instead.
      - name: Check out repository
        uses: actions/checkout@v4

      - id: filter
        name: Detect documentation changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # The site compiles the CLI to generate the command reference, so
          # cmd/rotor counts as documentation too.
          filters: |
            documentation:
              - .github/workflows/ci-documentation.yaml
              - cmd/rotor/**
              - documentation/**
              - mise.lock
              - mise.toml
              - package.json
              - patches/**
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - tsconfig.base.json

    timeout-minutes: 5

  # The docs site: type check, build (which regenerates the command
  # reference from the CLI), and the unit and Chromium browser tests.
  documentation:
    needs: changes
    if: needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Mise toolchain
        uses: jdx/mise-action@v2
        with:
          install_args: go node pnpm
          experimental: true

      - name: Restore Go module and build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-docs-${{ hashFiles('mise.toml', 'mise.lock', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-docs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: documentation

      - name: Type check
        run: node --run check
        working-directory: documentation

      - name: Unit tests
        run: node --run test:unit
        working-directory: documentation

      # Playwright builds the site and serves the preview itself.
      - name: Browser tests
        run: node --run test:browser
        working-directory: documentation

    timeout-minutes: 15
