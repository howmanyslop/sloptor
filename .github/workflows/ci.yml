name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up rotor toolchain
        uses: ./.github/actions/setup

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l internal cmd tools)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./internal/... ./cmd/... ./tools/...

      - name: Test
        run: |
          set -euo pipefail
          (cd tools/sidecar && node --test test/*.test.js) &
          sidecar_pid=$!
          node --test test/api.integration.test.js test/api.lifecycle.test.js &
          api_pid=$!
          go test ./... -count=1 &
          go_test_pid=$!

          status=0
          if ! wait "$sidecar_pid"; then
            status=1
          fi
          if ! wait "$api_pid"; then
            status=1
          fi
          if ! wait "$go_test_pid"; then
            status=1
          fi
          exit "$status"
        env:
          # The setup action installs testdata/transformers/project, so the
          # real-package transformer test must run here, never skip.
          ROTOR_REQUIRE_TRANSFORMERS_FIXTURE: "1"

  windows:
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up rotor toolchain
        uses: ./.github/actions/setup

      # Restore the cache before the long steps; an early download keeps a cold
      # cache available after cancellation or failure.
      - name: Cache go modules
        shell: bash
        run: go mod download

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          ( (cd tools/sidecar && node --test test/*.test.js) 2>&1 | tee "$RUNNER_TEMP/sidecar-test.log" ) &
          sidecar_pid=$!
          (node --test test/api.integration.test.js test/api.lifecycle.test.js 2>&1 | tee "$RUNNER_TEMP/api-test.log") &
          api_pid=$!
          (go test ./... -count=1 -timeout=30m 2>&1 | tee "$RUNNER_TEMP/go-test.log") &
          go_test_pid=$!

          status=0
          if ! wait "$sidecar_pid"; then
            status=1
          fi
          if ! wait "$api_pid"; then
            status=1
          fi
          if ! wait "$go_test_pid"; then
            status=1
          fi
          exit "$status"
        env:
          ROTOR_REQUIRE_TRANSFORMERS_FIXTURE: "1"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: |
            ${{ runner.temp }}/sidecar-test.log
            ${{ runner.temp }}/api-test.log
            ${{ runner.temp }}/go-test.log
          if-no-files-found: ignore

  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up rotor toolchain
        uses: ./.github/actions/setup

      - name: Race detector
        run: go test -race -shuffle=on -count=1 ./internal/logservice ./internal/compile ./cmd/rotor
        env:
          # The setup action installs testdata/transformers/project, so the
          # real-package transformer test must run here, never skip.
          ROTOR_REQUIRE_TRANSFORMERS_FIXTURE: "1"

  vuln:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Mise toolchain
        uses: jdx/mise-action@v2
        with:
          install_args: go go:golang.org/x/vuln/cmd/govulncheck
          experimental: true

      - name: Restore Go module and build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/AppData/Local/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('mise.toml', 'mise.lock', 'go.sum') }}

      - name: govulncheck
        # Reachability-scoped scan of the whole module (rotor + vendored tsgo):
        # fails the build only for advisories on code paths rotor can actually
        # execute.
        run: govulncheck ./...
