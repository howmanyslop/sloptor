name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: blacksmith-16vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l internal cmd tools)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./internal/... ./cmd/... ./tools/...

      - name: Build
        run: go build ./...

  test:
    runs-on: blacksmith-16vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up rotor toolchain
        uses: ./.github/actions/setup

      - name: Test
        run: |
          set -euo pipefail
          (cd tools/sidecar && node --test test/*.test.js) &
          sidecar_pid=$!
          go test ./... -count=1 &
          go_test_pid=$!

          status=0
          if ! wait "$sidecar_pid"; then
            status=1
          fi
          if ! wait "$go_test_pid"; then
            status=1
          fi
          exit "$status"
        env:
          # The setup action installs testdata/transformers/project, so the
          # real-package transformer test must run here, never skip.
          ROTOR_REQUIRE_TRANSFORMERS_FIXTURE: "1"

  windows:
    # Blacksmith Windows runner (Server 2025, GitHub image base) — GitHub's
    # windows-2022 hosted runners queue for minutes; Blacksmith provisions
    # on demand. Fall back to windows-2025 if the label is unavailable.
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up rotor toolchain
        uses: ./.github/actions/setup

      # Warm the module cache before the long steps. setup-go caches on
      # success only; this step downloads everything up front so a canceled
      # later step never wastes a cold cache on re-downloads.
      - name: Cache go modules
        shell: bash
        run: go mod download

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          ( (cd tools/sidecar && node --test test/*.test.js) 2>&1 | tee "$RUNNER_TEMP/sidecar-test.log" ) &
          sidecar_pid=$!
          (go test ./... -count=1 2>&1 | tee "$RUNNER_TEMP/go-test.log") &
          go_test_pid=$!

          status=0
          if ! wait "$sidecar_pid"; then
            status=1
          fi
          if ! wait "$go_test_pid"; then
            status=1
          fi
          exit "$status"
        env:
          ROTOR_REQUIRE_TRANSFORMERS_FIXTURE: "1"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: |
            ${{ runner.temp }}/sidecar-test.log
            ${{ runner.temp }}/go-test.log
          if-no-files-found: ignore

  race:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up rotor toolchain
        uses: ./.github/actions/setup

      - name: Race detector
        run: go test -race -shuffle=on -count=1 ./internal/logservice ./internal/compile ./cmd/rotor
        env:
          # The setup action installs testdata/transformers/project, so the
          # real-package transformer test must run here, never skip.
          ROTOR_REQUIRE_TRANSFORMERS_FIXTURE: "1"

  vuln:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        # Reachability-scoped scan of the whole module (rotor + vendored tsgo):
        # fails the build only for advisories on code paths rotor can actually
        # execute.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...
