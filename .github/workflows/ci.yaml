name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  # Debug info is the largest part of a test build and nothing in CI reads it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The release binary here only feeds forkparity and the API suites. Fat LTO
  # with one codegen unit rebuilds it whole every run (5-7 minutes on Windows)
  # and changes nothing they check. release.yaml keeps the real profile.
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_LTO: off
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  # mise.toml routes cargo through mbx, whose local cache starts empty on every
  # runner. Swatinem/rust-cache restores target/ instead.
  MBX_DISABLE: "1"
  NEXTEST_PROFILE: ci
  RUST_BACKTRACE: short

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which lanes this change needs. A skipped job still satisfies a
  # required check, so gated lanes never leave a PR waiting.
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      # Pushes are diffed with git; pull requests ask the API instead.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - id: filter
        name: Detect Rust-relevant changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          # Fails open: the Rust crates read testdata/, include/, reference/,
          # and tools/sidecar, so every path runs the Rust lanes except the
          # docs and release ones listed here. This file and the setup-rust
          # action are not among them, so a CI edit always proves itself.
          filters: |
            rust:
              - "**"
              - "!.github/workflows/ci-documentation.yaml"
              - "!.github/workflows/docs.yaml"
              - "!.github/workflows/release.yaml"
              - "!CHANGELOG.md"
              - "!CONTRIBUTING.md"
              - "!README.md"
              - "!docs/**"
              - "!documentation/**"
              - "!media/**"

    timeout-minutes: 5

  # crates/rotor_cli/tests/forkparity.rs compares the sloptor release binary
  # with the pinned roblox-ts fork and runs the Lune runtime suites behind the
  # ledger's upstream-corrected rows. `mise run rust:forkparity` builds the
  # release binary and hands it to the suite through ROTOR_BIN. Node, Rojo,
  # Lune and the fixture node_modules are what it needs.
  rust-forkparity:
    if: needs.changes.outputs.rust == 'true'
    name: rust-forkparity (${{ matrix.name }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Hosted Windows runners real-time-scan every file the toolchain and the
      # build touch.
      # Pure optimization: never fail a job over it.
      - continue-on-error: true
        if: runner.os == 'Windows'
        name: Disable Windows Defender real-time scanning
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: pwsh

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache-key: forkparity-${{ matrix.name }}
          fixtures: "true"
          tools: bun node cargo:cargo-nextest github:rojo-rbx/rojo github:lune-org/lune

      - name: Fork parity
        run: mise run rust:forkparity
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-24.04
          - name: windows
            runner: windows-2025

    timeout-minutes: 45

  # Mirrors `mise run rust:lint`: rustfmt, clippy (-D warnings), cargo-deny, and
  # cargo-machete. rust-test repeats clippy per OS for the cfg(target_os) code.
  rust-lint:
    if: needs.changes.outputs.rust == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache-key: lint
          tools: cargo-deny github:bnjbvr/cargo-machete

      - name: Lint
        run: mise run rust:lint

    timeout-minutes: 20

  # Mirrors `mise run rust:test` (nextest over the whole workspace) on every OS
  # sloptor ships on. That includes crates/rotor_compile/tests/conformance.rs,
  # the byte-for-byte golden gate. The fixture node_modules come from bun.
  rust-test:
    if: needs.changes.outputs.rust == 'true'
    name: rust-test (${{ matrix.name }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Hosted Windows runners real-time-scan every file the toolchain and the
      # build touch.
      # Pure optimization: never fail a job over it.
      - continue-on-error: true
        if: runner.os == 'Windows'
        name: Disable Windows Defender real-time scanning
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: pwsh

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache-key: test-${{ matrix.name }}
          fixtures: "true"
          # pnpm: the task7 flamework tests install their pinned oracle with it.
          tools: bun node pnpm cargo:cargo-nextest

      # The task7 flamework tests hard-link a ~2,400-file node_modules into
      # fresh temp dirs dozens of times. The default %TEMP% is on C:, the slow
      # OS disk; RUNNER_TEMP is on D: beside the workspace.
      # This must come after the toolchain step: mise-action extracts into
      # %TEMP% and renames into C:\Users\...\mise, which fails with EXDEV once
      # %TEMP% is on D:.
      - if: runner.os == 'Windows'
        name: Move temp directories off the OS disk
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Clippy
        # The same command as rust:lint, run per OS because the macOS and
        # Windows code paths only compile there.
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
        shell: bash

      - name: Test
        run: mise run rust:test
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-24.04
          - name: macos
            runner: macos-15
          - name: windows
            runner: windows-2025

    timeout-minutes: 45

  # Node suites on their own runner. The API integration suite builds the
  # sloptor release binary itself (cargo build in test.before), so it needs the
  # Rust toolchain; the cargo cache keeps that build warm.
  test-node:
    if: needs.changes.outputs.rust == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache-key: node
          fixtures: "true"
          tools: bun node

      - name: API integration tests
        run: node --test test/api.integration.test.js test/api.lifecycle.test.js

      - name: Sidecar tests
        run: node --test test/*.test.js
        working-directory: tools/sidecar

      - name: Package map resolution tests (Node 24)
        run: |
          mise install node@24
          mise exec node@24 -- node --test tools/sidecar/test/package-map.test.js

    timeout-minutes: 30

  windows-node:
    if: needs.changes.outputs.rust == 'true'
    needs: changes
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Pure optimization: never fail a job over it.
      - continue-on-error: true
        name: Disable Windows Defender real-time scanning
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: pwsh

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache-key: windows-node
          fixtures: "true"
          tools: bun node

      # The API integration suite builds the sloptor release binary in
      # test.before.
      - name: API integration tests
        run: node --test test/api.integration.test.js test/api.lifecycle.test.js
        shell: bash

      - name: Sidecar tests
        run: node --test test/*.test.js
        shell: bash
        working-directory: tools/sidecar

    timeout-minutes: 40

  # Not gated on the Rust filter: release.yaml, docs.yaml, and
  # ci-documentation.yaml count as Rust-free there, and they need linting most.
  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          experimental: true
          install_args: jactionlint

      - name: jactionlint
        # Same profile (.github/jactionlint.yaml) and exit policy as the hook.
        run: jactionlint --strict-exit .github/workflows/*.yaml .github/actions/setup-rust/action.yaml

    timeout-minutes: 5
