name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    needs:
      - compile
      - validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Mise toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          # Tag-triggered: never restore a cache into release artifacts.
          cache: false
          install_args: node
          experimental: true

      - name: Download executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          pattern: sloptor-bin-*
          merge-multiple: true

      - name: Package and verify release assets
        run: |
          set -euo pipefail

          package_target() {
            target_os="$1"
            target_arch="$2"
            suffix="$3"
            bare_name="sloptor-v$VERSION-$target_os-$target_arch-bin$suffix"
            stage_dir="$RUNNER_TEMP/package-$target_os-$target_arch"
            executable="sloptor$suffix"

            test -s "dist/$bare_name"
            mkdir -p "$stage_dir"
            cp "dist/$bare_name" "$stage_dir/$executable"
            cp README.md LICENSE "$stage_dir/"
            chmod +x "$stage_dir/$executable"

            if [ "$target_os" = "windows" ]; then
              (
                cd "$stage_dir"
                zip -q "$GITHUB_WORKSPACE/dist/sloptor-v$VERSION-$target_os-$target_arch.zip" "$executable" README.md LICENSE
              )
            else
              tar -C "$stage_dir" -czf "dist/sloptor-v$VERSION-$target_os-$target_arch.tar.gz" "$executable" README.md LICENSE
            fi
          }

          package_target darwin arm64 ""
          package_target linux amd64 ""
          package_target linux arm64 ""
          package_target windows amd64 ".exe"

          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 8

          (
            cd dist
            LC_ALL=C
            export LC_ALL
            checksum_file="sloptor-v$VERSION-checksums.txt"
            checksum_tmp="$RUNNER_TEMP/$checksum_file"
            find . -maxdepth 1 -type f ! -name "$checksum_file" -exec basename {} \; | sort | xargs sha256sum > "$checksum_tmp"
            mv "$checksum_tmp" "$checksum_file"
            sha256sum --check "sloptor-v$VERSION-checksums.txt"
          )

          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 9

          for archive in "dist/sloptor-v$VERSION-"*.tar.gz; do
            test "$(tar -tzf "$archive" | sort | paste -sd ' ' -)" = "LICENSE README.md sloptor"
          done
          for archive in "dist/sloptor-v$VERSION-"*.zip; do
            test "$(unzip -Z1 "$archive" | sort | paste -sd ' ' -)" = "LICENSE README.md sloptor.exe"
          done

          file "dist/sloptor-v$VERSION-darwin-arm64-bin" | grep -q "Mach-O.*arm64"
          file "dist/sloptor-v$VERSION-linux-amd64-bin" | grep -q "ELF 64-bit.*x86-64"
          file "dist/sloptor-v$VERSION-linux-arm64-bin" | grep -q "ELF 64-bit.*ARM aarch64"
          file "dist/sloptor-v$VERSION-windows-amd64-bin.exe" | grep -q "PE32+.*x86-64"
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Stage npm release packages
        run: |
          set -euo pipefail
          node scripts/stage-npm-release.cjs --dist dist --output dist/npm
          test "$(find dist/npm -maxdepth 1 -name '*.tgz' -type f | wc -l)" -eq 5

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

    timeout-minutes: 45

  changelog:
    permissions:
      contents: write
    needs: release-notes
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Mise toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          # Tag-triggered: never restore a cache into release artifacts.
          cache: false
          install_args: node pnpm
          experimental: true

      # sync-release-notes.ts imports arktype and tinyexec from @sloptor/scripts.
      - name: Install script dependencies
        run: pnpm install --frozen-lockfile --filter @sloptor/scripts

      - name: Write release notes to CHANGELOG.md and the documentation
        run: node scripts/sync-release-notes.ts --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit release notes to main
        run: |
          set -euo pipefail
          RELEASE_ARTIFACT="documentation/src/content/releases/$GITHUB_REF_NAME.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RELEASE_ARTIFACT" CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Release notes and changelog already match main"
            exit 0
          fi
          git commit -m "chore(docs): add $GITHUB_REF_NAME release notes"
          gh auth setup-git
          git push origin HEAD:main
        env:
          GH_TOKEN: ${{ github.token }}

    timeout-minutes: 10

  # One native runner per target, so every binary runs its own --version check
  # and none is cross-compiled. Each job uploads its bare executable; the
  # `build` job downloads all four and packages them.
  compile:
    name: Compile (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # mise.toml routes cargo through mbx, whose local cache starts empty on
      # a runner; a release build never reads a cache anyway.
      MBX_DISABLE: "1"
      RUST_BACKTRACE: short
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # No cargo cache restore (setup-rust skips it without a cache-key):
      # release binaries build from a clean target directory so a poisoned
      # cache entry cannot reach published assets.
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          mise-cache: "false"

      # tools/sidecar is embedded with include_bytes! from the checked-in
      # sources (crates/rotor_compile/src/sidecar_install.rs); there is no
      # sidecar build step to run before cargo.
      - name: Build release binary
        run: |
          set -euo pipefail
          # Same command as `mise run rust:release`, plus --target so the output
          # path is the same on every runner.
          cargo build --locked --release -p rotor_cli --target "$TRIPLE"

          output="dist/sloptor-v$VERSION-$GOOS-$GOARCH-bin$SUFFIX"
          mkdir -p dist
          cp "target/$TRIPLE/release/sloptor$SUFFIX" "$output"
          test -s "$output"
          chmod +x "$output"

          reported_version=$("$output" --version)
          if [ "$reported_version" != "$VERSION" ]; then
            echo "binary reports $reported_version, expected $VERSION"
            exit 1
          fi
        shell: bash
        env:
          # The equivalent of Go's -ldflags="-s -w".
          CARGO_PROFILE_RELEASE_STRIP: symbols
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
          SUFFIX: ${{ matrix.suffix }}
          TRIPLE: ${{ matrix.triple }}
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sloptor-bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/sloptor-v${{ needs.validate.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}-bin${{ matrix.suffix }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
    timeout-minutes: 60

    strategy:
      matrix:
        include:
          - goarch: arm64
            goos: darwin
            runner: macos-15
            suffix: ""
            target: darwin-arm64
            triple: aarch64-apple-darwin
          - goarch: arm64
            goos: linux
            runner: ubuntu-24.04-arm
            suffix: ""
            target: linux-arm64
            triple: aarch64-unknown-linux-gnu
          - goarch: amd64
            goos: linux
            runner: ubuntu-24.04
            suffix: ""
            target: linux-x64
            triple: x86_64-unknown-linux-gnu
          - goarch: amd64
            goos: windows
            runner: windows-2025
            suffix: .exe
            target: win32-x64
            triple: x86_64-pc-windows-msvc
      fail-fast: true

  deploy-documentation:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: changelog
    permissions:
      contents: read
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    uses: ./.github/workflows/docs.yaml
    with:
      ref: main

  publish:
    permissions:
      contents: write
    needs:
      - build
      - smoke-npm
      - validate
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-bundle
          path: dist

      - name: Publish verified release
        run: |
          set -euo pipefail

          (
            cd dist
            sha256sum --check "sloptor-v$VERSION-checksums.txt"
          )
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 9

          tag="$GITHUB_REF_NAME"
          prerelease_args=(--prerelease=false)
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args=(--prerelease)
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "release $tag is already published"
              exit 1
            fi
            gh release upload "$tag" "dist/sloptor-v$VERSION-"* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "dist/sloptor-v$VERSION-"* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$tag" \
              --notes "" \
              --draft \
              "${prerelease_args[@]}"
          fi

          asset_count=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          if [ "$asset_count" -ne 9 ]; then
            echo "draft release has $asset_count assets, expected 9"
            exit 1
          fi

          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false "${prerelease_args[@]}"

          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          while read -r hash filename; do
            remote_digest=$(jq -r --arg name "$filename" '.assets[] | select(.name == $name) | .digest' <<< "$release_json")
            if [ "$remote_digest" != "sha256:$hash" ]; then
              echo "$filename digest mismatch: $remote_digest != sha256:$hash"
              exit 1
            fi
          done < "dist/sloptor-v$VERSION-checksums.txt"

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}

    timeout-minutes: 10

  release-notes:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [validate, publish]
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          # Tag-triggered: never restore a cache into release artifacts.
          cache: false
          install_args: communique

      - env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        name: Generate and publish release notes
        run: communique generate "$GITHUB_REF_NAME" --github-release --review-report release-notes-review.md

      - if: always()
        name: Upload release notes coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: ignore
          name: release-notes-review
          path: release-notes-review.md

    timeout-minutes: 15

  smoke-npm:
    name: Smoke npm (${{ matrix.target }})
    needs:
      - validate
      - build
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-bundle
          path: dist

      - name: Smoke-test installed API and CLI
        run: node scripts/smoke-npm-release.cjs --bundle dist/npm --fixture test/fixtures/single-project
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: windows-2025
            target: win32-x64

    timeout-minutes: 10

  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Mise toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          # Tag-triggered: never restore a cache into release artifacts.
          cache: false
          install_args: node
          experimental: true

      - id: version
        name: Validate version
        run: |
          code_version=$(sed -n 's/^pub const VERSION: &str = "\(.*\)";$/\1/p' crates/rotor_support/src/version.rs)
          if [ -z "$code_version" ]; then
            echo "could not read VERSION from crates/rotor_support/src/version.rs"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$code_version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match crates/rotor_support/src/version.rs (v$code_version)"
            echo "bump the VERSION constant before tagging a release"
            exit 1
          fi
          validation_args=()
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            validation_args+=(--tag "$GITHUB_REF_NAME")
          fi
          node scripts/validate-release.cjs "${validation_args[@]}"
          echo "version=$code_version" >> "$GITHUB_OUTPUT"

    timeout-minutes: 10
