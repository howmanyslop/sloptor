# Block exotic sub-dependencies (e.g. git, file: deps)
blockExoticSubdeps: true
catalogMode: prefer
cleanupUnusedCatalogs: true

# Global virtual store (pnpm's node_modules/.pnpm equivalent)
enableGlobalVirtualStore: true
linkWorkspacePackages: true
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@astrojs/markdown-satteri"
  - "@astrojs/starlight"
  - "@biomejs/*"
  - "@oxfmt/*"
  - "@oxlint/*"
  - "@tsrs/*"
  - astro
  - oxfmt
  - oxlint
  - oxlint-plugin-utilities
  - skills
  - tsrs

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeStrict: true
# Use time-based resolution for reproducible installs
resolutionMode: time-based
shellEmulator: true
strictDepBuilds: true
strictPeerDependencies: true
# Keep every release target in the lockfile even when installing on one host.
supportedArchitectures:
  cpu:
    - arm64
    - x64
  os:
    - darwin
    - linux
    - win32

trustPolicy: no-downgrade

trustPolicyExclude:
  - "@tsrs/*"
  - skills
  - tsrs

trustPolicyIgnoreAfter: 10080

# Equivalent to pnpm-workspace.yaml `packages:`
packages:
  - documentation
  - packages/*
  - scripts
  - tools/lint-configurations

overrides:
  "@isentinel/eslint-config>@pobammer-ts/small-rules": catalog:lint

# Applies `componentExts` (.astro) to the options rules instead of oxfmt's file
# list; same patch as small-rules.
patchedDependencies:
  "@isentinel/eslint-config@6.1.0": patches/@isentinel__eslint-config@6.1.0.patch
  # Falls back to TypeScript's win32 compiler, since tsrs ships no Windows binary.
  tsrs@0.18.0-ts7.1.0-dev.20260929: patches/tsrs@0.18.0-ts7.1.0-dev.20260929.patch

catalogs:
  commitlint:
    "@commitlint/cli": 21.2.4
    "@commitlint/config-conventional": 21.2.4
    "@commitlint/types": 21.2.3
  frontend:
    "@astrojs/check": 0.9.10
    "@astrojs/markdown-satteri": 0.4.4
    "@astrojs/mdx": 8.1.0
    "@astrojs/react": 7.1.0
    "@astrojs/starlight": 0.42.6
    "@fontsource-variable/ibm-plex-sans": 5.3.0
    "@fontsource-variable/newsreader": 5.3.0
    "@fontsource/ibm-plex-mono": 5.3.0
    astro: 7.4.0
    get-tsconfig: 4.14.3
    oxc-transform-react: 0.154.0
    react: 19.3.1
    react-dom: 19.3.1
    sharp: 0.35.5
    shiki: 4.5.0
    wrangler: 4.151.1
  lint:
    "@biomejs/biome": 2.5.15
    "@isentinel/eslint-config": 6.1.0
    "@pobammer-ts/small-rules": 3.6.0
    "@vitest/eslint-plugin": 1.6.27
    eslint: 10.12.0
    eslint-plugin-antfu: 3.2.3
    eslint-plugin-astro: 3.2.1
    eslint-plugin-n: 18.4.1
    eslint-plugin-pnpm: 1.9.1
    eslint-plugin-react-jsx: 5.27.2
    eslint-plugin-react-naming-convention: 5.27.2
    eslint-plugin-react-x: 5.27.2
    eslint-plugin-regexp: 3.1.1
    eslint-plugin-sonarjs: 4.2.2
    eslint-plugin-unused-imports: 4.4.1
    knip: 6.31.0
    oxfmt: 0.74.0
    oxlint: 1.89.0
    oxlint-tsgolint: 7.0.2004
  runtime:
    effect: 4.0.1
  scripts:
    "@cliffy/command": jsr:@cliffy/command@1.3.1
    arktype: 2.2.8
    consola: 3.4.2
    tinyexec: 1.3.1
  test:
    "@playwright/test": 1.64.1
    "@testing-library/react": 16.3.3
    jsdom: 29.1.1
    vitest: 5.0.5
  tooling:
    bumpp: 12.3.0
    jiti: 2.7.0
    pncat: 0.13.0
    skills: 1.7.4
    tsrs: 0.18.0-ts7.1.0-dev.20260929
    typescript: 5.9.3
  types:
    "@total-typescript/ts-reset": 0.6.1
    "@types/bun": 1.4.3
    "@types/node": ^26.1.2
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    type-fest: 5.8.0

# Only allow specific packages to run install scripts
allowBuilds:
  "@openrouter/sdk": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  workerd: true

packageExtensions:
  astro@7.4.0:
    peerDependencies:
      "@astrojs/check": "*"
      typescript: "*"
    peerDependenciesMeta:
      "@astrojs/check":
        optional: true
      typescript:
        optional: true
  tsrs:
    optionalDependencies:
      "@typescript/typescript-win32-arm64": 7.1.0-dev.20260930.4
      "@typescript/typescript-win32-x64": 7.1.0-dev.20260930.4

peerDependencyRules:
  allowedVersions:
    "@astrojs/react>oxc-transform-react": 0.154.0
    "@emnapi/core": ">=1.0.0"
    "@emnapi/runtime": ">=1.0.0"
    "@vitejs/plugin-react>oxc-transform-react": 0.154.0

fetchRetries: 5
fetchRetryMaxtimeout: 30000
fetchRetryMintimeout: 1000
fetchTimeout: 60000
strictSsl: true
strictStorePkgContentCheck: true
verifyStoreIntegrity: true
