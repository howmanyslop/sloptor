autoInstallPeers: true
blockExoticSubdeps: true
catalogMode: prefer
cleanupUnusedCatalogs: true
enableGlobalVirtualStore: true
linkWorkspacePackages: true
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@astrojs/markdown-satteri"
  - "@astrojs/starlight"
  - "@biomejs/*"
  - "@oxfmt/*"
  - "@oxlint/*"
  - "@tsrs/*"
  - astro
  - oxfmt
  - oxlint
  - oxlint-plugin-utilities
  - skills
  - tsrs

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeStrict: true
resolutionMode: time-based
shellEmulator: true
strictDepBuilds: true
strictPeerDependencies: false

supportedArchitectures:
  cpu:
    - arm64
    - x64
  os:
    - darwin
    - linux
    - win32

trustPolicy: no-downgrade

trustPolicyExclude:
  - "@tsrs/*"
  - skills
  - tsrs

trustPolicyIgnoreAfter: 10080

# Equivalent to pnpm-workspace.yaml `packages:`
packages:
  - documentation
  - packages/*
  - scripts
  - tools/*

overrides:
  "@isentinel/eslint-config>@pobammer-ts/small-rules": catalog:lint

# Applies `componentExts` (.astro) to the options rules instead of oxfmt's file
# list; same patch as small-rules.
patchedDependencies:
  "@isentinel/eslint-config@6.3.0": patches/@isentinel__eslint-config@6.3.0.patch

catalogs:
  commitlint:
    "@commitlint/cli": 21.2.4
    "@commitlint/config-conventional": 21.2.4
    "@commitlint/types": 21.2.3
  frontend:
    "@astrojs/check": 0.9.10
    "@astrojs/markdown-satteri": 0.4.4
    "@astrojs/mdx": 8.1.0
    "@astrojs/react": 7.1.0
    "@astrojs/starlight": 0.42.6
    "@base-ui/react": 1.9.0
    "@fontsource-variable/ibm-plex-sans": 5.3.0
    "@fontsource-variable/newsreader": 5.3.0
    "@fontsource/ibm-plex-mono": 5.3.0
    "@number-flow/react": 0.6.2
    astro: 7.4.0
    get-tsconfig: 4.14.3
    oxc-transform-react: 0.154.0
    react: 19.3.1
    react-dom: 19.3.1
    recharts: 3.10.1
    sharp: 0.35.5
    shiki: 4.5.0
    wrangler: 4.151.1
  lint:
    "@biomejs/biome": 2.6.6
    "@isentinel/eslint-config": 6.3.0
    "@pobammer-ts/small-rules": 3.11.0
    "@typescript-eslint/parser": 8.65.0
    "@vitest/eslint-plugin": 1.6.28
    eslint: 10.14.0
    eslint-plugin-antfu: 3.3.1
    eslint-plugin-astro: 3.2.1
    eslint-plugin-n: 18.5.0
    eslint-plugin-pnpm: 1.9.1
    eslint-plugin-react-jsx: 5.28.8
    eslint-plugin-react-naming-convention: 5.28.8
    eslint-plugin-react-x: 5.28.8
    eslint-plugin-regexp: 3.1.1
    eslint-plugin-sonarjs: 4.2.2
    eslint-plugin-unused-imports: 4.4.1
    knip: 6.44.1
    oxfmt: 0.77.0
    oxlint: 1.92.0
    oxlint-plugin-react-doctor: 0.9.22
    oxlint-tsgolint: 7.0.2006
    react-doctor: 0.9.22
  runtime:
    effect: 4.0.1
  scripts:
    "@cliffy/command": jsr:@cliffy/command@1.3.1
    ansis: 4.5.0
    arktype: 2.2.8
    confbox: 0.3.2
    consola: 3.4.2
    empathic: 2.1.0
    tinyexec: 1.3.1
  test:
    "@playwright/test": 1.64.1
    "@testing-library/react": 16.3.3
    jsdom: 29.1.1
    vitest: 5.1.0
  tooling:
    bumpp: 12.3.0
    jiti: 2.7.0
    pncat: 0.13.4
    skills: 1.7.6
    tsrs: 0.22.0-ts7.1.0-beta
    typescript: ^6
  types:
    "@total-typescript/ts-reset": 0.6.1
    "@types/bun": 1.4.4
    "@types/node": ^26.6.6
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    type-fest: 5.8.0

# Only allow specific packages to run install scripts
allowBuilds:
  "@openrouter/sdk": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  workerd: true

packageExtensions:
  astro@7.4.0:
    peerDependencies:
      "@astrojs/check": "*"
      typescript: "*"
    peerDependenciesMeta:
      "@astrojs/check":
        optional: true
      typescript:
        optional: true
  tsrs:
    optionalDependencies:
      "@typescript/typescript-win32-arm64": 7.1.0-dev.20260930.4
      "@typescript/typescript-win32-x64": 7.1.0-dev.20260930.4

peerDependencyRules:
  allowedVersions:
    "@astrojs/react>oxc-transform-react": 0.154.0
    "@emnapi/core": ">=1.0.0"
    "@emnapi/runtime": ">=1.0.0"
    "@typescript-eslint/*>typescript": ">=6.0.0 <7.0.0"
    "@vitejs/plugin-react>oxc-transform-react": 0.154.0

fetchRetries: 5
fetchRetryMaxtimeout: 30000
fetchRetryMintimeout: 1000
fetchTimeout: 60000
strictSsl: true
strictStorePkgContentCheck: true
verifyStoreIntegrity: true
