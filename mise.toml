[env]
_.file = { path = ".env" }
_.path = ["{{config_root}}/node_modules/.bin", "{{cwd}}/node_modules/.bin"]
HK_MISE = 1

[settings]
auto_install = false
experimental = true
lockfile = true

[tools]
"github:rojo-rbx/rojo" = "7.6.1"
"github:lune-org/lune" = "0.10.1"
go = "1.26.6"
goreleaser = "latest"
hyperfine = "1.20.0"
communique = "latest"
ni = "latest"
node = "22"
pnpm = "12.3.1"
bun = "latest"
golangci-lint = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.3.0"
hk = "1.55.0"
rumdl = "latest"
actionlint = "latest"
gitleaks = "latest"
pkl = "latest"
shellcheck = "latest"
shfmt = "latest"
typos = "latest"

[tasks."build:one-shot"]
description = "Delete the supplied project's out/out-test/out-tsc directories and *.rbxtsc.tsbuildinfo state, then run one-shot (non-watch) rotor builds --json with --checkers 1 and --checkers equal to the detected logical CPU count. Usage: mise run build:one-shot -- <project-dir> <tsconfig-path> (tsconfig path relative to the project dir)."
usage = '''
arg "<project-dir>" help="External project directory"
arg "<tsconfig-path>" help="Path to tsconfig relative to the project directory"
'''
run = '''
set -euo pipefail

readonly project=$usage_project_dir
readonly tsconfig=$usage_tsconfig_path

[ -d "$project" ] || {
    echo "error: project directory not found: $project" >&2
    exit 1
}
[ -f "$project/$tsconfig" ] || {
    echo "error: tsconfig not found: $project/$tsconfig" >&2
    exit 1
}

cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null | tr -cd '0-9' || true)"
if [ -z "$cores" ]; then
    cores="$(sysctl -n hw.ncpu 2>/dev/null | tr -cd '0-9' || true)"
fi
cores="${cores:-1}"
readonly cores

reset_state() {
    rm -rf "$project/out" "$project/out-test" "$project/out-tsc"
    find "$project" -type f -name '*.rbxtsc.tsbuildinfo' \
        -not -path '*/node_modules/*' \
        -not -path '*/.git/*' \
        -not -path '*/.rotor/*' \
        -delete
}

reset_state
go run ./cmd/rotor build --project "$project/$tsconfig" --json --checkers 1

reset_state
go run ./cmd/rotor build --project "$project/$tsconfig" --json --checkers "$cores"
'''

[tasks."build:solution"]
description = "Delete the supplied project's out/out-test/out-tsc directories and *.rbxtsc.tsbuildinfo state, then run solution (project references) rotor builds --build --json with --builders 1 and --builders equal to the detected logical CPU count at a fixed --checkers 1. Usage: mise run build:solution -- <project-dir> <tsconfig-path> (tsconfig path relative to the project dir)."
usage = '''
arg "<project-dir>" help="External project directory"
arg "<tsconfig-path>" help="Path to tsconfig relative to the project directory"
'''
run = '''
set -euo pipefail

readonly project=$usage_project_dir
readonly tsconfig=$usage_tsconfig_path

[ -d "$project" ] || {
    echo "error: project directory not found: $project" >&2
    exit 1
}
[ -f "$project/$tsconfig" ] || {
    echo "error: tsconfig not found: $project/$tsconfig" >&2
    exit 1
}

cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null | tr -cd '0-9' || true)"
if [ -z "$cores" ]; then
    cores="$(sysctl -n hw.ncpu 2>/dev/null | tr -cd '0-9' || true)"
fi
cores="${cores:-1}"
readonly cores

reset_state() {
    rm -rf "$project/out" "$project/out-test" "$project/out-tsc"
    find "$project" -type f -name '*.rbxtsc.tsbuildinfo' \
        -not -path '*/node_modules/*' \
        -not -path '*/.git/*' \
        -not -path '*/.rotor/*' \
        -delete
}

reset_state
go run ./cmd/rotor build --build "$project/$tsconfig" --builders 1 --checkers 1 --json

reset_state
go run ./cmd/rotor build --build "$project/$tsconfig" --builders "$cores" --checkers 1 --json
'''

[tasks."benchmark:solution"]
description = "hyperfine benchmark of solution builds using one prebuilt sloptor binary. Matrix is defaults, 1x1, 1x4, 4x1, and 2x2 (capped to CPU count), not N-squared. Cold outputs each run. Usage: mise run benchmark:solution -- <project-dir> <tsconfig-path>."
usage = """
arg "<project-dir>" help="External project directory"
arg "<tsconfig-path>" help="Path to tsconfig relative to the project directory"
"""
run = '''
set -euo pipefail

readonly project=$usage_project_dir
readonly tsconfig=$usage_tsconfig_path

[ -d "$project" ] || {
    echo "error: project directory not found: $project" >&2
    exit 1
}
[ -f "$project/$tsconfig" ] || {
    echo "error: tsconfig not found: $project/$tsconfig" >&2
    exit 1
}

cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null | tr -cd '0-9' || true)"
if [ -z "$cores" ]; then
    cores="$(sysctl -n hw.ncpu 2>/dev/null | tr -cd '0-9' || true)"
fi
cores="${cores:-1}"
readonly cores

export PROJECT_DIR="$project"
export TSCONFIG_PATH="$tsconfig"
export CORES="$cores"

cap() {
    n=$1
    if [ "$n" -gt "$cores" ]; then
        echo "$cores"
    else
        echo "$n"
    fi
}
c4="$(cap 4)"
c2="$(cap 2)"
readonly c4 c2

bin="$(mktemp)"
trap 'rm -f "$bin"' EXIT
go build -trimpath -o "$bin" ./cmd/rotor
export SLOPTOR_BIN="$bin"

readonly prepareCommand="rm -rf \"$PROJECT_DIR/out\" \"$PROJECT_DIR/out-test\" \"$PROJECT_DIR/out-tsc\" && find \"$PROJECT_DIR\" -type f -name \"*.rbxtsc.tsbuildinfo\" -not -path \"*/node_modules/*\" -not -path \"*/.git/*\" -not -path \"*/.rotor/*\" -delete"

hyperfine \
    --warmup 1 \
    --prepare "$prepareCommand" \
    --export-json "${PROJECT_DIR}/sloptor-benchmark-solution.json" \
    --command-name "defaults" \
    --command-name "builders=1 checkers=1" \
    --command-name "builders=1 checkers=$c4" \
    --command-name "builders=$c4 checkers=1" \
    --command-name "builders=$c2 checkers=$c2" \
    "$SLOPTOR_BIN build --build $PROJECT_DIR/$TSCONFIG_PATH --json" \
    "$SLOPTOR_BIN build --build $PROJECT_DIR/$TSCONFIG_PATH --json --builders 1 --checkers 1" \
    "$SLOPTOR_BIN build --build $PROJECT_DIR/$TSCONFIG_PATH --json --builders 1 --checkers $c4" \
    "$SLOPTOR_BIN build --build $PROJECT_DIR/$TSCONFIG_PATH --json --builders $c4 --checkers 1" \
    "$SLOPTOR_BIN build --build $PROJECT_DIR/$TSCONFIG_PATH --json --builders $c2 --checkers $c2"
'''

[tasks."benchmark:one-shot"]
description = "hyperfine benchmark of one-shot builds using one prebuilt sloptor binary at --checkers 1 and --checkers min(4, CPUs). Cold outputs each run. Usage: mise run benchmark:one-shot -- <project-dir> <tsconfig-path>."
usage = """
arg "<project-dir>" help="External project directory"
arg "<tsconfig-path>" help="Path to tsconfig relative to the project directory"
"""
run = '''
set -euo pipefail

readonly project=$usage_project_dir
readonly tsconfig=$usage_tsconfig_path

[ -d "$project" ] || {
    echo "error: project directory not found: $project" >&2
    exit 1
}
[ -f "$project/$tsconfig" ] || {
    echo "error: tsconfig not found: $project/$tsconfig" >&2
    exit 1
}

cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null | tr -cd '0-9' || true)"
if [ -z "$cores" ]; then
    cores="$(sysctl -n hw.ncpu 2>/dev/null | tr -cd '0-9' || true)"
fi
cores="${cores:-1}"
readonly cores

export PROJECT_DIR="$project"
export TSCONFIG_PATH="$tsconfig"
export CORES="$cores"

c4="$cores"
if [ "$c4" -gt 4 ]; then
    c4=4
fi
readonly c4

bin="$(mktemp)"
trap 'rm -f "$bin"' EXIT
go build -trimpath -o "$bin" ./cmd/rotor
export SLOPTOR_BIN="$bin"

readonly prepareCommand="rm -rf \"$PROJECT_DIR/out\" \"$PROJECT_DIR/out-test\" \"$PROJECT_DIR/out-tsc\" && find \"$PROJECT_DIR\" -type f -name \"*.rbxtsc.tsbuildinfo\" -not -path \"*/node_modules/*\" -not -path \"*/.git/*\" -not -path \"*/.rotor/*\" -delete"

hyperfine \
    --warmup 1 \
    --prepare "$prepareCommand" \
    --export-json "${PROJECT_DIR}/sloptor-benchmark-one-shot.json" \
    --command-name "checkers=1" \
    --command-name "checkers=$c4" \
    "$SLOPTOR_BIN build --project $PROJECT_DIR/$TSCONFIG_PATH --json --checkers 1" \
    "$SLOPTOR_BIN build --project $PROJECT_DIR/$TSCONFIG_PATH --json --checkers $c4"
'''

[tasks."amend:no-verify"]
description = "Amends the staged changes, reusing the previous commit message."
run = "git commit --amend --reuse-message=HEAD --signoff --no-verify"

[tasks."commit:no-verify"]
description = "Commits the staged changes without running Git hooks."
usage = """
arg <message> {
    help "Git commit message"
}
"""
run = """
git commit --signoff --message "${usage_message?}" --no-verify
"""

[tasks.amend]
description = "Amends the staged changes, reusing the previous commit message."
run = "git commit --amend --reuse-message=HEAD --signoff"

[tasks.commit]
description = "Commits the staged changes."
usage = """
arg <message> {
    help "Git commit message"
}
"""
run = """
git commit --signoff --message "${usage_message?}"
"""

[tasks.hooks]
description = "Install hk git hooks into this clone (safe to re-run)."
run = "hk install"
