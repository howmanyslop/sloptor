[env]
_.file = { path = ".env" }
_.path = ["{{config_root}}/node_modules/.bin", "{{cwd}}/node_modules/.bin"]
HK_MISE = 1

[settings]
experimental = true
auto_install = false
lockfile = true
cargo.binstall_native = true

[tools]
"cargo:cargo-nextest" = "latest"
"github:bnjbvr/cargo-machete" = "latest"
"github:lune-org/lune" = "0.10.1"
"github:rojo-rbx/rojo" = "7.6.1"
betterleaks = "latest"
bun = "latest"
cargo-deny = "latest"
communique = "latest"
container = { version = "latest", os = ["macos/arm64"] }
hk = { version = "2.9.0", workflow = "release.yml" }
hyperfine = "2.0.0"
jactionlint = "latest"
luau = "latest"
mr-boxington = { version = "latest", workflow = "release.yml@refs/heads/main" }
ni = "latest"
node = "22"
pkl = "latest"
pnpm = "12.16.1"
rumdl = "latest"
rust = { version = "1.99.1", components = ["rustfmt", "clippy"], mr_boxington = true }
shellcheck = "latest"
shfmt = "latest"
tak = "0.0.13"
tombi = "latest"
typos = "latest"
vale = "latest"
"github:plasma-node/rbxtsgo" = "0.1.1"
"github:howmanyslop/sloptor" = "3.0.0-beta.3"

[tasks."amend:no-verify"]
description = "Amends the staged changes, reusing the previous commit message."
run = "git commit --amend --reuse-message=HEAD --signoff --no-verify"

[tasks."benchmark:one-shot"]
description = "hyperfine benchmark of one-shot builds using one prebuilt sloptor binary at --checkers 1 and --checkers min(4, CPUs). Cold outputs each run. Usage: mise run benchmark:one-shot -- <project-dir> <tsconfig-path>."
usage = """
arg "<project-dir>" help="External project directory"
arg "<tsconfig-path>" help="Path to tsconfig relative to the project directory"
"""
shell = "sh -o errexit -c"
run = '''
set -euo pipefail

readonly project=$usage_project_dir
readonly tsconfig=$usage_tsconfig_path

[ -d "$project" ] || {
	echo "error: project directory not found: $project" >&2
	exit 1
}
[ -f "$project/$tsconfig" ] || {
	echo "error: tsconfig not found: $project/$tsconfig" >&2
	exit 1
}

cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null | tr -cd '0-9' || true)"
if [ -z "$cores" ]; then
	cores="$(sysctl -n hw.ncpu 2>/dev/null | tr -cd '0-9' || true)"
fi
cores="${cores:-1}"
readonly cores

export PROJECT_DIR="$project"
export TSCONFIG_PATH="$tsconfig"
export CORES="$cores"

c4="$cores"
if [ "$c4" -gt 4 ]; then
	c4=4
fi
readonly c4

cargo build --locked --release -p rotor_cli
SLOPTOR_BIN="${CARGO_TARGET_DIR:-target}/release/sloptor"
export SLOPTOR_BIN

# hyperfine 2.0 executes commands directly and splits each command string
# itself. Quote paths so a space or quote stays one argument.
quote() {
	printf "'"
	printf '%s' "$1" | sed "s/'/'\\\\''/g"
	printf "'"
}
readonly bin project_config
bin="$(quote "$SLOPTOR_BIN")"
project_config="$(quote "$PROJECT_DIR/$TSCONFIG_PATH")"

readonly prepareCommand="rm -rf \"$PROJECT_DIR/out\" \"$PROJECT_DIR/out-test\" \"$PROJECT_DIR/out-tsc\" && find \"$PROJECT_DIR\" -type f -name \"*.rbxtsc.tsbuildinfo\" -not -path \"*/node_modules/*\" -not -path \"*/.git/*\" -not -path \"*/.rotor/*\" -delete"

hyperfine \
	--warmup 1 \
	--prepare "$prepareCommand" \
	--export-json "${PROJECT_DIR}/sloptor-benchmark-one-shot.json" \
	--command-name "checkers=1" \
	--command-name "checkers=$c4" \
	"$bin build --project $project_config --json --checkers 1" \
	"$bin build --project $project_config --json --checkers $c4"
'''

[tasks."benchmark:solution"]
description = "hyperfine benchmark of solution builds using one prebuilt sloptor binary. Matrix is defaults, 1x1, 1x4, 4x1, and 2x2 (capped to CPU count), not N-squared. Cold outputs each run. Usage: mise run benchmark:solution -- <project-dir> <tsconfig-path>."
usage = """
arg "<project-dir>" help="External project directory"
arg "<tsconfig-path>" help="Path to tsconfig relative to the project directory"
"""
shell = "sh -o errexit -c"
run = '''
set -euo pipefail

readonly project=$usage_project_dir
readonly tsconfig=$usage_tsconfig_path

[ -d "$project" ] || {
	echo "error: project directory not found: $project" >&2
	exit 1
}
[ -f "$project/$tsconfig" ] || {
	echo "error: tsconfig not found: $project/$tsconfig" >&2
	exit 1
}

cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null | tr -cd '0-9' || true)"
if [ -z "$cores" ]; then
	cores="$(sysctl -n hw.ncpu 2>/dev/null | tr -cd '0-9' || true)"
fi
cores="${cores:-1}"
readonly cores

export PROJECT_DIR="$project"
export TSCONFIG_PATH="$tsconfig"
export CORES="$cores"

cap() {
	n=$1
	if [ "$n" -gt "$cores" ]; then
		echo "$cores"
	else
		echo "$n"
		fi
}
c4="$(cap 4)"
c2="$(cap 2)"
readonly c4 c2

cargo build --locked --release -p rotor_cli
SLOPTOR_BIN="${CARGO_TARGET_DIR:-target}/release/sloptor"
export SLOPTOR_BIN

# hyperfine 2.0 executes commands directly and splits each command string
# itself. Quote paths so a space or quote stays one argument.
quote() {
	printf "'"
	printf '%s' "$1" | sed "s/'/'\\\\''/g"
	printf "'"
}
readonly bin project_config
bin="$(quote "$SLOPTOR_BIN")"
project_config="$(quote "$PROJECT_DIR/$TSCONFIG_PATH")"

readonly prepareCommand="rm -rf \"$PROJECT_DIR/out\" \"$PROJECT_DIR/out-test\" \"$PROJECT_DIR/out-tsc\" && find \"$PROJECT_DIR\" -type f -name \"*.rbxtsc.tsbuildinfo\" -not -path \"*/node_modules/*\" -not -path \"*/.git/*\" -not -path \"*/.rotor/*\" -delete"

hyperfine \
	--warmup 1 \
	--prepare "$prepareCommand" \
	--export-json "${PROJECT_DIR}/sloptor-benchmark-solution.json" \
	--command-name "defaults" \
	--command-name "builders=1 checkers=1" \
	--command-name "builders=1 checkers=$c4" \
	--command-name "builders=$c4 checkers=1" \
	--command-name "builders=$c2 checkers=$c2" \
	"$bin build --build $project_config --json" \
	"$bin build --build $project_config --json --builders 1 --checkers 1" \
	"$bin build --build $project_config --json --builders 1 --checkers $c4" \
	"$bin build --build $project_config --json --builders $c4 --checkers 1" \
	"$bin build --build $project_config --json --builders $c2 --checkers $c2"
'''

[tasks."build:one-shot"]
description = "Delete the supplied project's out/out-test/out-tsc directories and *.rbxtsc.tsbuildinfo state, then run one-shot (non-watch) rotor builds --json with --checkers 1 and --checkers equal to the detected logical CPU count. Usage: mise run build:one-shot -- <project-dir> <tsconfig-path> (tsconfig path relative to the project dir)."
usage = '''
arg "<project-dir>" help="External project directory"
arg "<tsconfig-path>" help="Path to tsconfig relative to the project directory"
'''
shell = "sh -o errexit -c"
run = '''
set -euo pipefail

readonly project=$usage_project_dir
readonly tsconfig=$usage_tsconfig_path

[ -d "$project" ] || {
	echo "error: project directory not found: $project" >&2
	exit 1
}
[ -f "$project/$tsconfig" ] || {
	echo "error: tsconfig not found: $project/$tsconfig" >&2
	exit 1
}

cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null | tr -cd '0-9' || true)"
if [ -z "$cores" ]; then
	cores="$(sysctl -n hw.ncpu 2>/dev/null | tr -cd '0-9' || true)"
fi
cores="${cores:-1}"
readonly cores

reset_state() {
	rm -rf "$project/out" "$project/out-test" "$project/out-tsc"
	find "$project" -type f -name '*.rbxtsc.tsbuildinfo' \
		-not -path '*/node_modules/*' \
		-not -path '*/.git/*' \
		-not -path '*/.rotor/*' \
		-delete
}

reset_state
cargo run --locked --release -p rotor_cli -- build --project "$project/$tsconfig" --json --checkers 1

reset_state
cargo run --locked --release -p rotor_cli -- build --project "$project/$tsconfig" --json --checkers "$cores"
'''

[tasks."build:solution"]
description = "Delete the supplied project's out/out-test/out-tsc directories and *.rbxtsc.tsbuildinfo state, then run solution (project references) rotor builds --build --json with --builders 1 and --builders equal to the detected logical CPU count at a fixed --checkers 1. Usage: mise run build:solution -- <project-dir> <tsconfig-path> (tsconfig path relative to the project dir)."
usage = '''
arg "<project-dir>" help="External project directory"
arg "<tsconfig-path>" help="Path to tsconfig relative to the project directory"
'''
shell = "sh -o errexit -c"
run = '''
set -euo pipefail

readonly project=$usage_project_dir
readonly tsconfig=$usage_tsconfig_path

[ -d "$project" ] || {
	echo "error: project directory not found: $project" >&2
	exit 1
}
[ -f "$project/$tsconfig" ] || {
	echo "error: tsconfig not found: $project/$tsconfig" >&2
	exit 1
}

cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null | tr -cd '0-9' || true)"
if [ -z "$cores" ]; then
	cores="$(sysctl -n hw.ncpu 2>/dev/null | tr -cd '0-9' || true)"
fi
cores="${cores:-1}"
readonly cores

reset_state() {
	rm -rf "$project/out" "$project/out-test" "$project/out-tsc"
	find "$project" -type f -name '*.rbxtsc.tsbuildinfo' \
		-not -path '*/node_modules/*' \
		-not -path '*/.git/*' \
		-not -path '*/.rotor/*' \
		-delete
}

reset_state
cargo run --locked --release -p rotor_cli -- build --build "$project/$tsconfig" --builders 1 --checkers 1 --json

reset_state
cargo run --locked --release -p rotor_cli -- build --build "$project/$tsconfig" --builders "$cores" --checkers 1 --json
'''

[tasks."commit:no-verify"]
description = "Commits the staged changes without running Git hooks."
usage = """
arg <message> {
	help "Git commit message"
}
"""
shell = "sh -o errexit -c"
run = """
git commit --signoff --message "${usage_message?}" --no-verify
"""

[tasks."docs:generate"]
description = "Write the CLI reference pages for the documentation site from the live command tree."
run = "cargo run --locked -p rotor_cli -- gen-docs documentation/src/content/docs/commands"

[tasks."perf:record"]
description = "Builds the sloptor release binary, then records the tak benchmarks into refs/notes/tak."
depends = ["rust:release"]
shell = "sh -o errexit -c"
run = '''
SLOPTOR_BIN="${CARGO_TARGET_DIR:-target}/release/sloptor"
export SLOPTOR_BIN
tak run --record
'''

[tasks."rust:build"]
description = "Builds the Rust workspace."
run = "cargo build --locked --workspace"

[tasks."rust:check"]
description = "Lints, then tests the Rust workspace."
depends = ["rust:lint"]
run = "mise run rust:test"

[tasks."rust:conformance"]
description = "Runs the conformance gate: every golden compiled and compared byte for byte."
run = "cargo nextest run --locked -p rotor_compile --test conformance"

[tasks."rust:fmt"]
description = "Formats the Rust workspace."
run = "cargo fmt"

[tasks."rust:forkparity"]
description = "Runs rotor_cli's forkparity suite with its ignored tests: sloptor against the pinned roblox-ts fork's frozen output, the divergence ledger, and the Lune runtime suites. Builds the release binary and names it in ROTOR_BIN. Needs node, npm, rojo and lune; a suite without rojo or lune says SKIPPED in its output."
depends = ["rust:release"]
shell = "sh -o errexit -c"
run = '''
exe=sloptor
here="pwd"
case "$(uname -s)" in
# Native Windows programs cannot read Git Bash's /c/... paths.
MINGW* | MSYS* | CYGWIN*)
	exe=sloptor.exe
	here="pwd -W"
	;;
esac
target="${CARGO_TARGET_DIR:-target}"
ROTOR_BIN="$(cd "$target" && $here)/release/$exe"
export ROTOR_BIN
cargo nextest run --locked -p rotor_cli --test forkparity --run-ignored all --success-output final
'''

[tasks."rust:gc"]
description = "Garbage-collects the mbx build cache."
run = "mbx gc"

[tasks."rust:lint"]
description = "Checks formatting, clippy (-D warnings), cargo-deny, and cargo-machete."
run = [
	"cargo fmt -- --check",
	"cargo clippy --locked --workspace --all-targets -- -D warnings",
	"cargo deny check",
	"cargo machete",
]

[tasks."rust:release"]
description = "Builds the sloptor release binary."
run = "cargo build --locked --release -p rotor_cli"

[tasks."rust:test"]
description = "Runs the Rust workspace tests with nextest."
run = "cargo nextest run --locked --workspace --no-tests=pass"

[tasks."tools:test"]
description = "Runs the unit tests for tools/tsrs-mirror."
run = "vitest run tools/tsrs-mirror"

[tasks."tsrs:mirror"]
description = "Re-vendors the pinned tsrs release into third_party/tsrs (needs network). Pass --source <checkout> to use a local checkout at the pinned commit."
run = "node tools/tsrs-mirror/main.ts"

[tasks.amend]
description = "Amends the staged changes, reusing the previous commit message."
run = "git commit --amend --reuse-message=HEAD --signoff"

[tasks.commit]
description = "Commits the staged changes."
usage = """
arg <message> {
	help "Git commit message"
}
"""
shell = "sh -o errexit -c"
run = """
git commit --signoff --message "${usage_message?}"
"""

[tasks.deploy-docs]
alias = "dd"
description = "Trigger the Deploy Documentation workflow. Rebuilds and deploys the docs site without a release."
run = "gh workflow run 'Deploy Documentation' --ref main"

[tasks.documentation]
description = "Run the documentation type check, build, and unit and Chromium browser tests."
run = "pnpm --filter @sloptor/documentation exec playwright install chromium && pnpm --filter @sloptor/documentation run check && pnpm --filter @sloptor/documentation run build && pnpm --filter @sloptor/documentation run test:unit && pnpm --filter @sloptor/documentation run test:browser"

[tasks.hooks]
description = "Install hk git hooks into this clone (safe to re-run)."
run = "hk install"

[tasks.lint-configuration]
description = "View the lint configuration."
usage = '''
arg "<type>" {
	help "What linting configuration do you want to run the inspector for?"
	choices "eslint" "oxlint"
}
'''
run = '''
#!/usr/bin/env bash

set -euo pipefail

case "${usage_type?}" in
	eslint)
		nlx @eslint/config-inspector
		;;
	oxlint)
		nlx oxlint-config-inspector
		;;
esac
'''

[tasks.perf]
description = "Builds the sloptor release binary, then measures the tak benchmarks. Timing only without Valgrind."
depends = ["rust:release"]
shell = "sh -o errexit -c"
run = '''
SLOPTOR_BIN="${CARGO_TARGET_DIR:-target}/release/sloptor"
export SLOPTOR_BIN
tak run
'''
