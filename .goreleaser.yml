# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: sloptor

builds:
  - id: rotor
    main: ./cmd/rotor
    binary: sloptor
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # sloptor's version is defined in code (internal/version/version.go); the
    # release workflow verifies the tag matches it, so no -X injection here.
    ldflags:
      - -s -w

archives:
  - id: rotor
    ids:
      - rotor
    name_template: "sloptor-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
  # Bare executables for the npm/bun installer (scripts/install.js downloads
  # these directly; windows gets .exe appended automatically by GoReleaser).
  - id: rotor-bin
    ids:
      - rotor
    name_template: "sloptor-v{{ .Version }}-{{ .Os }}-{{ .Arch }}-bin"
    formats:
      - binary

checksum:
  name_template: "sloptor-v{{ .Version }}-checksums.txt"

release:
  github:
    owner: howmanysmall
    name: rotor
  prerelease: auto

changelog:
  disable: true
