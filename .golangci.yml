# golangci-lint v2 configuration - https://golangci-lint.run/docs/configuration/file/
#
# Runs over ./internal/... ./cmd/... ./tools/... only (see hk.pkl and ci.yml);
# tsgo/, reference/, and include/ are vendored mirrors and never linted.
#
# Cognitive complexity is reported, not gated: `hk run reports` (see hk.pkl).
version: "2"

run:
  timeout: 10m

linters:
  default: standard
  exclusions:
    generated: lax
    paths:
      - tsgo
      - reference
      - include
      - testdata
  settings:
    errcheck:
      # Console and HTTP-response writes; a failed write to a terminal or a
      # closed response has nowhere useful to be reported.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

# NOTE: gofumpt is intentionally NOT enabled here. golangci-lint 2.15.0's
# gofumpt formatter merges import groups even though it embeds gofumpt v0.12.0,
# which (like the mise-pinned binary, goimports, and gofmt) keeps stdlib and
# module imports in separate groups. Enabling it makes `golangci-lint run` and
# `gofumpt -l` contradict each other on ~300 files with no stable fixpoint.
# gofumpt is enforced instead by the hk `gofumpt` step and the CI formatting
# gate, both of which use the mise-pinned gofumpt binary.
formatters:
  enable:
    - goimports
  exclusions:
    paths:
      - tsgo
      - reference
      - include
      - testdata

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
