# golangci-lint v2 configuration - https://golangci-lint.run/docs/configuration/file/
#
# Runs over ./internal/... ./cmd/... ./tools/... only (see hk.pkl and ci.yml);
# tsgo/, reference/, and include/ are vendored mirrors and never linted.
#
# Cognitive complexity is reported, not gated: `hk run reports` (see hk.pkl).
version: "2"

run:
  timeout: 10m

linters:
  default: standard
  exclusions:
    generated: lax
    paths:
      - tsgo
      - reference
      - include
      - testdata
  settings:
    errcheck:
      # Console and HTTP-response writes; a failed write to a terminal or a
      # closed response has nowhere useful to be reported.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    paths:
      - tsgo
      - reference
      - include
      - testdata
  settings:
    gofumpt:
      extra-rules: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
