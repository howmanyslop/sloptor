# Mirrors the global `exclude` list in hk.pkl, so a bare `typos` run matches the hook.
[files]
extend-exclude = [
	"node_modules",
	"dist",
	"bin",
	"third_party",
	"reference",
	"include",
	"**/testdata/**",
	"media",
	"profiles",
	"**/*.prof",
	"**/*-lock.json",
	"**/*-lock.yaml",
	"mise.lock",
	"roblox-ts.zip",
	"turbo-slop",
	".omo",
	".serena",
	".claude",
	".agents/skills",
	"rotor.schema.json",
	"rbxts-tsconfig.schema.json",
	"oxlint.config.ts",
]

[default.extend-words]
ba = "ba"
childs = "childs"
curren = "curren"
iif = "iif"
inferrable = "inferrable"
mis = "mis"
onces = "onces"
pn = "pn"
tak = "tak"
tru = "tru"
unparseable = "unparseable"
writables = "writables"

[default.extend-identifiers]
# Go encoding/json scanner state for the literal "false" (rotor_flamework/src/json_syntax.rs).
Fals = "Fals"
# tasklist /FO, its output format flag (rotor_compile/src/tests/sidecar_parallel.rs).
FO = "FO"
# rustix::fs::Mode::WOTH, the others-write permission bit.
WOTH = "WOTH"
iz = "iz"
